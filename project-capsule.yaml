schema_version: c2.project-capsule.v1
identity:
  project_id: 93
  slug: whatsapp-watcher
  repository_id: R0093
scope:
  purpose: Watch whether the latest outgoing message in one user-selected WhatsApp
    Web chat becomes read and show a local desktop notification.
  boundaries:
  - WhatsApp Web and Chrome/Chromium storage and notifications are external browser
    services.
  - The extension does not send WhatsApp content or metadata to external servers.
  - Historical C2/C3 are frozen references; no dispatch or lifecycle writes. MegaVault
    owns cross-project identity and inventory.
repository:
  canonical_workdir: /home/daniele/projects/whatsapp-watcher
  branch_policy: Canonical repository follows origin/main; make changes in isolated
    repo-task worktrees and integrate through the guarded single-writer lane.
architecture:
  summary: A Manifest V3 content script reads visible WhatsApp Web DOM status markers
    for one armed chat, persists bounded state in chrome.storage.local, and asks the
    background service worker to display a desktop notification. read-policy.js owns
    pure marker/label/color classification and stable fingerprints, loaded first by
    the manifest; content.js retains DOM observation, UI, storage and notification
    orchestration.
  entrypoints:
  - manifest.json
  - content.js
  - background.js
  important_paths:
  - manifest.json
  - content.js
  - background.js
  - README.md
  - read-policy.js
  - tests
dependencies:
- name: Chrome or Chromium
  purpose: Host the extension content script, background service worker, local storage,
    and desktop notification APIs.
- name: WhatsApp Web
  purpose: Rendered DOM source of outgoing-message read state for the user-selected
    chat.
data:
  schema: Browser extension local storage key whatsappWatcherState contains armed
    state, selected chat label, current message identifier or fingerprint, last observed
    read state, and notification deduplication key. No server-side database exists.
  migrations: No migration framework; extension state is local and initialized with
    defaults by content.js.
runtime:
  services:
  - Chrome/Chromium Manifest V3 background service worker declared in manifest.json;
    MegaVault records no OS systemd service for this project.
  timers: []
  containers: []
devices: []
