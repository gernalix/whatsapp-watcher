  setup:
    not_applicable: Install the unpacked extension through Chrome/Chromium Developer
      mode; this repository has no setup script or package installer.
  build:
    not_applicable: The extension is plain JavaScript and a Manifest V3 JSON file;
      there is no build system.
  test_targeted:
