safety:
  invariants:
  - Host permissions and content scripts remain restricted to https://web.whatsapp.com/*.
  - Read state only from the DOM already rendered by WhatsApp Web; do not use private
    stores, WebSocket interception, or account APIs.
  - Never transmit chat labels, message identifiers, content, or read state to an
    external server.
  - Persist only bounded chat/message tracking state in browser-local extension storage.
  risky_operations:
  - Loading the extension into a real browser enables DOM observation on WhatsApp
    Web; user action in the extension panel selects and arms one chat.
  - Browser storage and desktop notifications change local browser/desktop state;
    validate source without using a real chat or profile.
  recovery:
  - Click Stop in the watcher panel to disarm the selected chat; disabling or removing
    the extension stops its content script.
  - Browser-local watcher state can be cleared through the browser's extension storage
    controls.
acceptance:
- Capsule FAST and FULL validators pass against the reviewed integrated repository
  head.
- JavaScript syntax and manifest JSON validate without opening WhatsApp Web or accessing
  chat data.
- No network behavior or private WhatsApp APIs are introduced.
- Offline policy fixtures verify supplied marker/label/color values and packaged load
  order; real DOM recognition and notification delivery still require separately scoped
  browser acceptance.
references:
  megavault: /home/daniele/MegaVault/megavault.sqlite
  c2: Historical-only format reference; no runtime or lifecycle dependency.
