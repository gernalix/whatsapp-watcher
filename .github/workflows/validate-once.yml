name: Validate whatsapp-watcher once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-once.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Syntax and manifest checks
        shell: bash
        run: |
          set -euo pipefail
          node --check content.js
          node --check background.js
          python3 -m json.tool manifest.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          data = Path('icon128.png').read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n')
          print('VALIDATE=PASS')
          PY
